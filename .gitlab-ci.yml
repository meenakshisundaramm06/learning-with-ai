default:
  image: node:20-alpine

stages:
  - verify
  - deploy

verify-site:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  rules:
    - if: $CI_COMMIT_BRANCH

deploy-pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  pages:
    publish: dist
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
